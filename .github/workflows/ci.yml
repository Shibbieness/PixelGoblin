name: CI

on: [push, pull_request]

jobs:
  gates:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build gates (from empty)
        env:
          PYTHONHASHSEED: "0"
        run: python tests/gate.py --from-empty
