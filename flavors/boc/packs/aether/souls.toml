# The Aether Library's named souls, as PixelGoblin avatar seeds (pixelgoblin avatar <name>).
schema = "pixelgoblin/souls@1"
id = "boc.aether.souls"
license = "Proprietary"
rule = "supplement-but-never-overwrite: a PixelGoblin avatar is a new appearance offered for a soul; it never replaces an existing identity, and nothing is written into the Aether Library"
seed = "seed = seed_from_name('soul:' + soul_name); soul_name survives reincarnation, so the avatar does too"
source = "aether-library: GLOSSARY.md, canonical documents, db (read-only)"

[[entities]]
id = "aelren"
name = "Aelren of Brackrun-Hollow"
soul_name = "Aelren of Brackrun-Hollow"
role = "boc.goblin.elder_scholar"
sub = "boc.race.sub.human"
kind = "character (Class 1, Pathway A)"
summary = "Hamlet saint and master Curse-Wheat tender in a Cursed Ruins hamlet; crosses S-Rank at sim-year 50 via third ENDEMIC promotion; dies at 82 and is archived, seeding the tutelary saint. soul_name 'soul:aelren-brackrun-0001'; CASL core values: careful-attention, lineage-respect, patient-instruction, honest-self-assessment."

